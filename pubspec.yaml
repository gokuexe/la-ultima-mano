name: la_ultima_mano
description: La Última Mano - juego de cartas de terror psicológico, recuerdos y paranoia.
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  game_core:
    path: packages/game_core
  flutter:
    sdk: flutter
  audioplayers: ^6.8.0
  web_socket_channel: ^3.0.3
  http: ^1.6.0
  web: ^1.1.2
  cupertino_icons: ^2.0.0
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  integration_test:
    sdk: flutter
  la_ultima_mano_server:
    path: server
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/art/
    - assets/fonts/LiberationSans-LICENSE.txt

  fonts:
    - family: Pixelify
      fonts:
        - asset: assets/fonts/PixelifySans.ttf

    - family: LiberationSans
      fonts:
        - asset: assets/fonts/LiberationSans-Regular.ttf
        - asset: assets/fonts/LiberationSans-Bold.ttf
          weight: 700
